name: Artifact Node App CI/CD

on:
  push:
    paths:
      - "**"
    branches: [main, develop]
  pull_request:
    paths:
      - "**"
    branches: [main]

env:
  NODE_VERSION: "18"
  APP_PATH: ""

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [16, 18]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      - name: Show Node version
        run: node -v

      - name: Info
        run: echo "Running Node ${{ matrix.node }} on ${{ matrix.os }}"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-node-${{ matrix.node }}
          path: dist


  test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [16, 18]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Test Node App
        uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - run: |
          echo "Testing Node App on Node ${{ matrix.node }} version"
          npm ci
          npm test

  use-artifact:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-node-${{ env.NODE_VERSION }}
          path: dist

      - name: Build Docker image
        run: |
          docker build -t node-artifact-demo .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/node-artifact-demo
          docker tag node-artifact-demo:latest $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: use-artifact
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}
    steps:
      - name: Deploy Node App
        run: |
          echo "Deploying Node App to ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }} server..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/node-artifact-demo:latest
          docker run -d -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/node-artifact-demo:latest
          echo "Node App deployed successfully!"
          echo "API_URL: ${{ vars.API_URL }}"
          echo "DB_NAME: ${{ vars.DB_NAME }}"
